name: ci

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go mod download
        run: go mod download

      - name: vet
        run: go vet ./...

      - name: build
        run: make build

      - name: test
        run: make test

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # v9 requires golangci-lint v2 (our .golangci.yml is already v2-format)
      # and runs on Node 24 (v6 used Node 20 → deprecation warning). Pin
      # `version: v2` alias so we get the latest v2 release without
      # unpredictable jumps into a hypothetical v3 later.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2
