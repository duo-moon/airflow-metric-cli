version: 2

project_name: afmetric

before:
  hooks:
    - go mod tidy

builds:
  - id: afmetric
    main: ./cmd/afmetric
    binary: afmetric
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/duo-moon/airflow-metric-cli/internal/version.Version={{.Version}}
      - -X github.com/duo-moon/airflow-metric-cli/internal/version.Commit={{.ShortCommit}}
      - -X github.com/duo-moon/airflow-metric-cli/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

release:
  draft: true
  prerelease: auto

# Homebrew tap. Requires:
#   * A separate repo duo-moon/homebrew-tap (create manually, one-time).
#   * HOMEBREW_TAP_TOKEN secret in this repo — a PAT with `repo` scope on
#     the tap repository.
# Skipped automatically for pre-release tags (v0.1.0-rc1 etc.).
brews:
  - name: afmetric
    repository:
      owner: duo-moon
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/duo-moon/airflow-metric-cli
    description: Terminal dashboard for monitoring Apache Airflow via REST API.
    license: MIT
    directory: Formula
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    skip_upload: auto  # skip for -rc / -beta tags
    test: |
      system "#{bin}/afmetric", "version"
